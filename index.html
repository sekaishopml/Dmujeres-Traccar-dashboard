<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="${colorPrimary}" />
    <meta name="description" content="${description}" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css">
    <title>${title}</title>
    <style>
      .loader {
        position: fixed; inset: 0; margin: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #F6F6F6;
        z-index: 9999;
      }
      .loader .loader-logo {
        width: min(300px, 70vw);
        height: auto;
        max-height: 140px;
        object-fit: contain;
      }
      .loader .loader-spinner {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 4px solid #e0e0e0;
        border-right-color: #EB0045;
        animation: loader-spin 1s linear infinite;
      }
      .loader .loader-text {
        font-family: 'Roboto', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 14px;
        color: #181818;
      }
      @keyframes loader-spin {
        to { transform: rotate(1turn); }
      }
      @media (prefers-color-scheme: dark) {
        .loader { background: #121212; }
        .loader .loader-text { color: #eeeeee; }
      }
    </style>
  </head>
  <body>
    <noscript>Enable JavaScript to use <a href="https://www.traccar.org/">Traccar GPS Tracking System</a>.</noscript>
    <div id="root" class="root"></div>
    <div class="loader">
      <img class="loader-logo" src="/logo-banner.png" alt="DMujeres" />
      <div class="loader-spinner"></div>
      <div class="loader-text">Cargando...</div>
    </div>
    <script type="module" src="/src/index.jsx" onerror="alert('Loading error.')"></script>
  </body>
</html>
