<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DMUJERES.EC">
  <rect width="512" height="512" rx="96" fill="#0A0B14"/>
  <!-- subtle gradients -->
  <circle cx="120" cy="120" r="180" fill="url(#g1)" opacity="0.18"/>
  <circle cx="420" cy="400" r="160" fill="url(#g2)" opacity="0.14"/>
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D8A"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#3BB2D0"/>
    </linearGradient>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EB0045"/>
      <stop offset="100%" stop-color="#7C3AED"/>
