  <!-- Wordmark -->
  <g text-anchor="middle" font-family="'Roboto','Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="256" y="225" font-size="52" font-weight="800" letter-spacing="0.08em" fill="#F5F5F7">DMUJERES</text>
    <text x="256" y="270" font-size="46" font-weight="800" letter-spacing="0.16em" fill="url(#tGrad)">.EC</text>
    <text x="256" y="305" font-size="13" font-weight="600" letter-spacing="0.32em" fill="#9BA1B6">BELLEZA PROFESIONAL</text>
