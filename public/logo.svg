    <text x="256" y="372" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.18em" fill="#F5F5F7" font-family="'Roboto','Segoe UI',Arial,sans-serif">ENTERPRISE TRACKING</text>
